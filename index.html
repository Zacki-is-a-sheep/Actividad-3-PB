<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Resumen</title>
    
</head>
<body>
    <!-- Esta pag contiene, Barra Superior, Contenido principal, Menu lateral, Area Contenido, Encabezado, Tarjetas, Zona Pedidos, Columna principal, Columna secundaria -->
    <!-- Eso para resumir el como se va a repartir el contenido-->
     
    <div class="pagina">

      <!-- Barra superior -->
      <header class="barra-superior"></header>

      <!-- Contenido principal -->

      <main class="principal">
        <!-- Menú lateral -->
        <aside class="menu-lateral"></aside>

        <!-- Área de contenido -->
        <section class="contenido">

          <!-- Encabezado -->
          <div id="summary-cards">
            <header class="encabezado"></header>
          </div>

          <!-- Tarjetas -->
          <div id="charts">
          </div>

          <!-- Zona Pedidos -->
          <div id="pedidos">

              <!-- Columna principal -->
              <div class="columna-izquierda">
              </div>

              <!-- Columna secundaria -->
              <div id="info-cards">
                <aside class="columna-derecha">

                </aside>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
