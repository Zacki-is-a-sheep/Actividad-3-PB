<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Resumen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Esta pag contiene, Barra Superior, Contenido principal, Menu lateral, Area Contenido, Encabezado, Tarjetas, Zona Pedidos, Columna principal, Columna secundaria -->
    <!-- Eso para resumir el como se va a repartir el contenido-->

    <div class="pagina">

      <!-- Barra superior -->
        <header class="barra-superior"></header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Mercado Campesino</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Página Principal</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Catalogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Pedidos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
      

      <!-- Contenido principal -->

      <main class="principal">
        <!-- Menú lateral -->
        <aside class="menu-lateral"></aside>
            <div class="d-flex flex-column flex-shrink-0 p-3 bg-dark text-white" style="width: 280px; height: 100vh;">
                <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                    <span class="fs-4">Mi menú ampliado</span>
                </a>
                <hr>
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active text-white" aria-current="page">Pantalla Principal</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Catalogo</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Ordenes</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Productos</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Quienes somos</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Politica de servicio al Cliente</a>
                    </li>
                    <li>
                        <a href="#" class="nav-link text-white">Quejas y reclamos</a>
                    </li>
                </ul>
                <hr>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                        <strong>User Profile</strong>
                    </a>
                </div>
            </div>

        <!-- Área de contenido -->
        <section class="contenido">

          <!-- Encabezado -->
          <div id="summary-cards">
            <header class="encabezado"></header>
          </div>

          <!-- Tarjetas -->
          <div id="charts">
          </div>

          <!-- Zona Pedidos -->
          <div id="pedidos">

              <!-- Columna principal -->
              <div class="columna-izquierda">
              </div>

              <!-- Columna secundaria -->
              <div id="info-cards">
                <aside class="columna-derecha">

                </aside>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
